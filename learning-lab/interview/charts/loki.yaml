deploymentMode: SingleBinary
global:
  dnsService: rke2-coredns-rke2-coredns
loki:
  auth_enabled: false
  image:
    tag: 3.6.16
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
  memberlistConfig:
    join_members: []
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: logging-local
    size: 5Gi
    whenScaled: Retain
    whenDeleted: Retain
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway:
  enabled: true
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}
