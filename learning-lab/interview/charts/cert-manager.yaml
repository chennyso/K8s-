crds:
  enabled: true
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels: {release: monitoring}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {cpu: 200m, memory: 128Mi}
cainjector:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 192Mi}
