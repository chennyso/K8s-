apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: interview-ca}
spec:
  ca: {secretName: interview-root-ca}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: tasks-tls, namespace: interview-app}
spec:
  secretName: tasks-tls
  issuerRef: {name: interview-ca, kind: ClusterIssuer}
  dnsNames: [tasks.204.test, localhost]
  ipAddresses: [127.0.0.1]
  duration: 2160h
  renewBefore: 360h
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tasks, namespace: interview-app}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tasks.204.test]
      secretName: tasks-tls
  rules:
    - host: tasks.204.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: tasks, port: {name: http}}
