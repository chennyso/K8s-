apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks
  namespace: interview-app
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: tasks}
  template:
    metadata:
      labels: {app: tasks}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: registry}]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tasks
          image: 192.168.204.1:15000/learning/tasks:1.0.1
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: application}}]
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
