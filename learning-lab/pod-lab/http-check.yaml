apiVersion: batch/v1
kind: Job
metadata:
  name: http-check
  namespace: pod-lab
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels: {access: allowed}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: check
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: [wget, -qO-, -T, "5", http://pod-web:8080/status.json]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
