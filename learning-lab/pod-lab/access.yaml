apiVersion: v1
kind: ServiceAccount
metadata:
  name: learner
  namespace: pod-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: pod-lab
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learner-reader
  namespace: pod-lab
subjects:
  - {kind: ServiceAccount, name: learner, namespace: pod-lab}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-web-ingress
  namespace: pod-lab
spec:
  podSelector:
    matchLabels: {app: pod-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {access: allowed}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - ipBlock: {cidr: 192.168.204.0/24}
      ports:
        - {protocol: TCP, port: 8080}
