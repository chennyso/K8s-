apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-web
  namespace: pod-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: pod-web}
  template:
    metadata:
      labels: {app: pod-web}
    spec:
      shareProcessNamespace: true
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: pod-web}
      initContainers:
        - name: initialize
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - cp /scripts/index.html /data/index.html; printf '0\n' > /data/counter; touch /data/ready /data/live
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: data, mountPath: /data}
      containers:
        - name: server
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: [sh, /scripts/server.sh]
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -ec, 'test -f /data/ready && test -f /data/status.json']
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command: [test, -f, /data/live]
            periodSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: data, mountPath: /data}
        - name: writer
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: [sh, /scripts/writer.sh]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: data, mountPath: /data}
        - name: inspector
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: [sleep, infinity]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: scripts
          configMap:
            name: pod-lab-scripts
            defaultMode: 0444
        - name: data
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pod-web
  namespace: pod-lab
  labels: {app: pod-web}
spec:
  type: NodePort
  selector: {app: pod-web}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30082}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pod-web
  namespace: pod-lab
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: pod-web}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pod-web
  namespace: pod-lab
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app: pod-web}
  endpoints:
    - {port: http, path: /metrics.txt, interval: 15s}
