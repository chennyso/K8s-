apiVersion: v1
kind: Namespace
metadata:
  name: pod-lab
  labels:
    project: pod-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pod-lab-budget
  namespace: pod-lab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "6"
    limits.memory: 2Gi
    pods: "24"
