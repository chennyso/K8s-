<main><header class="intro"><p>实验环境 · 2026 年 10 月 28 日</p><h1>从零搭建 Kubernetes 与项目实战</h1><p>按照概念理解、集群安装、项目操作、状态观察和故障恢复的顺序学习。七篇配套教程提供命令、配置解释和练习。</p><p class="notice">操作前确认自己的集群和命名空间。本文私有地址描述实验拓扑，复现时修改为自己的网络。故障实验会重启容器、修改副本或停止数据库，请在专用实验环境执行。认证信息由读者自行生成并保存在私有目录。</p></header>{{CONTENT}}</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({startOnLoad:true,securityLevel:'strict',theme:'neutral'});
document.querySelector('#print').addEventListener('click',()=>window.print());
document.querySelector('#search').addEventListener('input',event=>{const query=event.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('.chapter').forEach(section=>{section.hidden=!!query&&!section.textContent.toLowerCase().includes(query);if(!section.hidden)count++;});document.querySelector('#search-status').textContent=`显示 ${count} / 7 篇教程`;});
document.querySelectorAll('pre:not(.mermaid)').forEach(block=>{const button=document.createElement('button');button.className='copy';button.textContent='复制命令';button.addEventListener('click',async()=>{await navigator.clipboard.writeText(block.querySelector('code').textContent);button.textContent='已经复制';setTimeout(()=>button.textContent='复制命令',1500);});block.prepend(button);});
document.querySelectorAll('nav a').forEach(link=>link.addEventListener('click',()=>{document.querySelector('#search').value='';document.querySelectorAll('.chapter').forEach(section=>section.hidden=false);document.querySelector('#search-status').textContent='';}));
</script>
