apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: cpu-gang-demo
  namespace: cloud-native-lab
  labels:
    app.kubernetes.io/part-of: cloud-native-learning-lab
spec:
  schedulerName: volcano
  queue: default
  minAvailable: 2
  tasks:
    - name: worker
      replicas: 2
      policies:
        - event: TaskCompleted
          action: CompleteJob
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.37
              command: ["sh", "-c"]
              args:
                - "echo worker=$VK_TASK_INDEX host=$(hostname); sleep 20; echo worker=$VK_TASK_INDEX completed"
              resources:
                requests:
                  cpu: "100m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
