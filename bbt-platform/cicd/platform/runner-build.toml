[[runners]]
  [runners.kubernetes]
    namespace = "ci-build"
    image = "moby/buildkit:v0.25.1-rootless"
    service_account = "ci-job"
    automount_service_account_token = false
    privileged = false
    cpu_request = "500m"
    cpu_limit = "2"
    memory_request = "512Mi"
    memory_limit = "2Gi"
    [runners.kubernetes.pod_security_context]
      fs_group = 1000
    [runners.kubernetes.build_container_security_context]
      run_as_user = 1000
      run_as_group = 1000
      [runners.kubernetes.build_container_security_context.seccomp_profile]
        type = "Unconfined"
      [runners.kubernetes.build_container_security_context.app_armor_profile]
        type = "Unconfined"
    [[runners.kubernetes.volumes.empty_dir]]
      name = "runtime"
      mount_path = "/run/user/1000"
      medium = "Memory"
    [[runners.kubernetes.volumes.config_map]]
      name = "buildkit-config"
      mount_path = "/etc/buildkit"
