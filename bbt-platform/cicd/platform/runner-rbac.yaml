apiVersion: v1
kind: Namespace
metadata:
  name: ci-test
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-runner, namespace: ci-test}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-job, namespace: ci-test}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ci-runner, namespace: ci-test}
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/attach, pods/log, secrets, services, events]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-runner, namespace: ci-test}
subjects: [{kind: ServiceAccount, name: ci-runner, namespace: ci-test}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-build
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-runner, namespace: ci-build}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-job, namespace: ci-build}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ci-runner, namespace: ci-build}
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/attach, pods/log, secrets, services, events]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-runner, namespace: ci-build}
subjects: [{kind: ServiceAccount, name: ci-runner, namespace: ci-build}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner}
