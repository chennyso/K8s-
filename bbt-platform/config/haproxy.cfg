global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend rke2_registration
    bind *:9345
    default_backend registration_servers

backend registration_servers
    balance roundrobin
    server cp1 172.20.10.11:9345 check
    server cp2 172.20.10.12:9345 check
    server cp3 172.20.10.13:9345 check

frontend kubernetes_api
    bind *:6443
    default_backend api_servers

backend api_servers
    balance roundrobin
    server cp1 172.20.10.11:6443 check
    server cp2 172.20.10.12:6443 check
    server cp3 172.20.10.13:6443 check

frontend platform_https
    bind *:443
    default_backend ingress_servers

backend ingress_servers
    balance roundrobin
    server g5 172.20.10.21:443 check
    server g6 172.20.10.22:443 check
