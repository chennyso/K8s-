apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: platform-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bbt-slurm-state
  labels: {bbt-state: slurm}
spec:
  capacity: {storage: 4Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: platform-local
  local: {path: /var/lib/bbt-state/slurm}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cpu1]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bbt-slurm-mariadb
  labels: {bbt-state: mariadb}
spec:
  capacity: {storage: 4Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: platform-local
  local: {path: /var/lib/bbt-state/mariadb}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cpu2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurm-state
  namespace: slurm
spec:
  storageClassName: platform-local
  accessModes: [ReadWriteOnce]
  selector:
    matchLabels: {bbt-state: slurm}
  resources:
    requests: {storage: 4Gi}
