global_defs {
    enable_script_security
    script_user root
}
vrrp_script check_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    fall 2
    rise 2
}
vrrp_instance PLATFORM_VIP {
    state BACKUP
    interface ens18
    virtual_router_id 51
    priority 150
    advert_int 1
    unicast_src_ip 172.20.10.8
    unicast_peer {
        172.20.10.9
    }
    virtual_ipaddress {
        172.20.10.10/24 dev ens18
    }
    track_script {
        check_haproxy
    }
}
