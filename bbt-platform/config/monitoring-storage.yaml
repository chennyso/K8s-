apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bbt-prometheus
  labels: {monitoring-volume: prometheus}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-local
  local: {path: /var/lib/bbt-monitoring/prometheus}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cpu1]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bbt-grafana
  labels: {monitoring-volume: grafana}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-local
  local: {path: /var/lib/bbt-monitoring/grafana}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cpu2]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bbt-alertmanager
  labels: {monitoring-volume: alertmanager}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-local
  local: {path: /var/lib/bbt-monitoring/alertmanager}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cpu2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  storageClassName: monitoring-local
  accessModes: [ReadWriteOnce]
  selector:
    matchLabels: {monitoring-volume: grafana}
  resources:
    requests: {storage: 1Gi}
