apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-ib-network
  namespace: advisor-zhangsan
  annotations:
    k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "sriov-ib-network",
      "type": "ib-sriov",
      "link_state": "enable",
      "ipam": {"type": "nv-ipam", "poolName": "sriov-ib-pool"}
    }
