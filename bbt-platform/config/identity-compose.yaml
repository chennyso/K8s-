services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?请提供私有身份配置}"
    volumes: ["./keycloak-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    command: [start, --hostname=https://auth.bbt.example.com, --http-enabled=true, --proxy-headers=xforwarded]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?请提供私有身份配置}"
      KC_BOOTSTRAP_ADMIN_USERNAME: platform-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?请提供私有身份配置}"
    ports: ["127.0.0.1:8080:8080"]
