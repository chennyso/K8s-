replicaCount: 1
nfs:
  server: 172.20.10.30
  path: /exports/bbt
storageClass:
  name: nfs-client
  defaultClass: true
  reclaimPolicy: Retain
  archiveOnDelete: true
  pathPattern: "${.PVC.namespace}/${.PVC.name}"
  accessModes: ReadWriteMany
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
