apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: slurm
spec:
  selector: {app: slurm-mariadb}
  ports:
    - {name: mysql, port: 3306, targetPort: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: slurm
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {app: slurm-mariadb}
  template:
    metadata:
      labels: {app: slurm-mariadb}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - {name: MARIADB_DATABASE, value: slurm_acct_db}
            - {name: MARIADB_USER, value: slurm}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: {name: mariadb-password, key: password}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mariadb-password, key: root-password}
          ports:
            - {name: mysql, containerPort: 3306}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: socket, mountPath: /run/mysqld}
      volumes:
        - name: socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: platform-local
        selector:
          matchLabels: {bbt-state: mariadb}
        resources:
          requests: {storage: 4Gi}
