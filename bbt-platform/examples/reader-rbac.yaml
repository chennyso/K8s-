apiVersion: v1
kind: ServiceAccount
metadata:
  name: bbt-learning-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bbt-learning-reader
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bbt-learning-reader
subjects:
  - kind: ServiceAccount
    name: bbt-learning-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bbt-learning-reader
